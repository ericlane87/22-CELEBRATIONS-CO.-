<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 Celebration Co. – Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVIGATION -->
    <header class="header">
        <div class="logo">22 Celebration Co.</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="store.html" class="active">Store</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="store-container">

        <h1 class="store-title">Shop Our Celebration Boxes</h1>

        <!-- SEARCH + FILTERS -->
        <div class="store-controls">
            <select id="occasionFilter">
                <option value="">All Occasions</option>
                <option value="New Year">New Year</option>
                <option value="Valentine's Day">Valentine's Day</option>
                <option value="St. Patrick's Day">St. Patrick's Day</option>
                <option value="Easter">Easter</option>
                <option value="Mother's Day">Mother's Day</option>
                <option value="Father's Day">Father's Day</option>
                <option value="Graduation">Graduation</option>
                <option value="Fourth of July">Fourth of July</option>
                <option value="Halloween">Halloween</option>
                <option value="Thanksgiving">Thanksgiving</option>
                <option value="Christmas">Christmas</option>
                <option value="Hanukkah">Hanukkah</option>
                <option value="Kwanzaa">Kwanzaa</option>
                <option value="Birthday - Him">Birthday - Him</option>
                <option value="Birthday - Her">Birthday - Her</option>
                <option value="Birthday - Kids">Birthday - Kids</option>
                <option value="Baby Shower">Baby Shower</option>
                <option value="Wedding">Wedding</option>
                <option value="Anniversary">Anniversary</option>
                <option value="Retirement">Retirement</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search products...">

            <button id="searchBtn">Search</button>
        </div>

        <!-- PRODUCT GRID -->
        <div id="productGrid" class="product-grid"></div>

    </main>

    <script src="products.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("productGrid");
            const filter = document.getElementById("occasionFilter");
            const search = document.getElementById("searchInput");
            const searchBtn = document.getElementById("searchBtn");

            function displayProducts(list) {
                grid.innerHTML = "";

                if (list.length === 0) {
                    grid.innerHTML = "<p class='no-results'>No products found.</p>";
                    return;
                }

                list.forEach(product => {
                    const card = document.createElement("a");
                    card.href = "#"; 
                    card.className = "product-card";

                    card.innerHTML = `
                        <div class="product-img">Image Coming Soon</div>
                        <h3>${product.name}</h3>
                        <p class="product-desc">${product.description}</p>
                        <p class="product-price">$${product.price.toFixed(2)}</p>
                    `;

                    grid.appendChild(card);
                });
            }

            function applyFilters() {
                const occasionVal = filter.value.toLowerCase();
                const searchVal = search.value.toLowerCase();

                const results = products.filter(prod => {
                    const matchOccasion = occasionVal === "" || prod.occasions.some(o => o.toLowerCase() === occasionVal);
                    const matchSearch =
                        prod.name.toLowerCase().includes(searchVal) ||
                        prod.description.toLowerCase().includes(searchVal);
                    return matchOccasion && matchSearch;
                });

                displayProducts(results);
            }

            // Load all products on page load
            displayProducts(products);

            // Search + Filter Events
            filter.addEventListener("change", applyFilters);
            searchBtn.addEventListener("click", applyFilters);
            search.addEventListener("keyup", e => {
                if (e.key === "Enter") applyFilters();
            });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop – 22 Celebration Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="products.js" defer></script>

  <script defer>
  document.addEventListener("DOMContentLoaded", () => {

    const grid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const searchBtn = document.getElementById("searchBtn");

    // Load random products on first visit
    const initial = [...products].sort(() => Math.random() - 0.5).slice(0, 30);
    render(initial);

    searchBtn.onclick = runSearch;
    categorySelect.onchange = runSearch;
    searchInput.onkeypress = (e) => { if (e.key === "Enter") runSearch(); };

    function runSearch() {
      let keyword = searchInput.value.toLowerCase();
      let cat = categorySelect.value;

      let list = products;

      if (cat !== "all") {
        list = list.filter(p => p.occasions.includes(cat));
      }

      if (keyword) {
        list = list.filter(p =>
          p.name.toLowerCase().includes(keyword) ||
          p.occasions.join(" ").toLowerCase().includes(keyword)
        );
      }

      render(list);
    }

    function render(list) {
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `
          <p style="color:var(--text-muted); font-size:1.2rem;">
            No matching products found.
          </p>`;
        return;
      }

      list.forEach(item => {
        let card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
          <div class="product-image">Image Coming Soon</div>
          <div class="product-info">
            <h3 class="product-name">${item.name}</h3>
            <p class="product-meta">Occasions: ${item.occasions.join(", ")}</p>
            <p class="product-meta">For: ${item.gender} • Max Age ${item.maxAge}</p>
            <p class="product-price">$${item.price.toFixed(2)}</p>
            <button class="btn-primary" onclick="alert('Added to cart!')">Add to Cart</button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

  });
  </script>

</head>

<body>

<header class="site-header">
  <div class="logo">
    <span class="logo-mark">22</span>
    <span class="logo-text">Celebration Co.</span>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a class="active" href="store.html">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>

  <a href="tel:17708201456" class="btn-phone">(770) 820-1456</a>
</header>



<main>

<section class="section">
  <h1 class="section-title">Shop Our Gifts</h1>
  <p class="section-subtitle" style="max-width:700px;">
    Search by holiday, occasion, or keyword to find the perfect gift.
  </p>
</section>

<section class="section store-filters">

  <input id="searchInput" class="search-input" type="text" placeholder="Search gifts...">

  <select id="categorySelect" class="search-select">
    <option value="all">All Occasions</option>
    <option value="New Year">New Year</option>
    <option value="Valentine's Day">Valentine's Day</option>
    <option value="St. Patrick's Day">St. Patrick's Day</option>
    <option value="Easter">Easter</option>
    <option value="Mother's Day">Mother's Day</option>
    <option value="Father's Day">Father's Day</option>
    <option value="Graduation">Graduation</option>
    <option value="Fourth of July">Fourth of July</option>
    <option value="Back to School">Back to School</option>
    <option value="Halloween">Halloween</option>
    <option value="Thanksgiving">Thanksgiving</option>
    <option value="Christmas">Christmas</option>
    <option value="Hanukkah">Hanukkah</option>
    <option value="Kwanzaa">Kwanzaa</option>
    <option value="Birthday - Him">Birthday - Him</option>
    <option value="Birthday - Her">Birthday - Her</option>
    <option value="Birthday - Kids">Birthday - Kids</option>
    <option value="Baby Shower">Baby Shower</option>
    <option value="Wedding">Wedding</option>
    <option value="Anniversary">Anniversary</option>
    <option value="Retirement">Retirement</option>
  </select>

  <button id="searchBtn" class="btn-primary">Search</button>

</section>


<section class="section">
  <div id="productGrid" class="product-grid"></div>
</section>

</main>



<footer class="site-footer">
  <p>&copy; <span id="year"></span> 22 Celebration Co.</p>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

</body>
</html>

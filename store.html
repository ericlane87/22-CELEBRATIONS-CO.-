<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop – 22 Celebration Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- Product Data -->
  <script src="products.js" defer></script>
</head>

<body>

<!-- ====================================================== -->
<!-- HEADER -->
<!-- ====================================================== -->
<header class="site-header">
  <div class="logo">
    <span class="logo-mark">22</span>
    <span class="logo-text">Celebration Co.</span>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="store.html" class="active">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>

  <a href="tel:17708201456" class="btn-phone">(770) 820-1456</a>
</header>



<!-- ====================================================== -->
<!-- MAIN CONTENT -->
<!-- ====================================================== -->
<main>

<section class="section">
  <h1 class="section-title">Shop Gift Boxes & Baskets</h1>
  <p class="section-subtitle">
    Browse pre-packaged favorites or find the perfect option based on the holiday.
  </p>
</section>


<!-- ====================================================== -->
<!-- FILTER BAR -->
<!-- ====================================================== -->
<section class="section">
  <div class="filter-bar">

    <!-- SEARCH -->
    <div class="filter-group" style="flex:1;">
      <label>Search</label>
      <input id="searchInput" type="text" placeholder="Search gifts…">
    </div>

    <!-- CATEGORY -->
    <div class="filter-group">
      <label>Occasion</label>
      <select id="categorySelect">
        <option value="">All Occasions</option>
        <option>New Year</option>
        <option>Valentine's Day</option>
        <option>St. Patrick's Day</option>
        <option>Easter</option>
        <option>Mother's Day</option>
        <option>Father's Day</option>
        <option>Graduation</option>
        <option>Fourth of July</option>
        <option>Back to School</option>
        <option>Halloween</option>
        <option>Thanksgiving</option>
        <option>Christmas</option>
        <option>Hanukkah</option>
        <option>Kwanzaa</option>
        <option>Birthday - Him</option>
        <option>Birthday - Her</option>
        <option>Birthday - Kids</option>
        <option>Baby Shower</option>
        <option>Wedding</option>
        <option>Anniversary</option>
        <option>Retirement</option>
        <option>Housewarming</option>
      </select>
    </div>

  </div>
</section>



<!-- ====================================================== -->
<!-- PRODUCT GRID -->
<!-- ====================================================== -->
<section class="section">
  <div id="productGrid" class="products-grid"></div>
</section>

</main>



<!-- ====================================================== -->
<!-- FOOTER -->
<!-- ====================================================== -->
<footer class="site-footer">
  <p>&copy; <span id="year"></span> 22 Celebration Co.</p>
</footer>


<script>
document.getElementById("year").textContent = new Date().getFullYear();


// ================================================================
// RENDER PRODUCTS
// ================================================================
document.addEventListener("DOMContentLoaded", () => {

  const grid = document.getElementById("productGrid");
  const searchInput = document.getElementById("searchInput");
  const categorySelect = document.getElementById("categorySelect");

  // Safety: ensure products.js loaded
  let allProducts = Array.isArray(products) ? products : [];

  // Render product card template
  function renderItem(p) {
    return `
      <div class="product-card">
        <div class="product-image-placeholder">Image Coming Soon</div>

        <div class="product-body">
          <h3>${p.name}</h3>
          <p class="product-occasion">${p.occasions.join(", ")}</p>

          <div class="product-meta">
            <span>${p.gender}</span>
            <span>Age ≤ ${p.maxAge}</span>
          </div>

          <p class="product-price">$${p.price}</p>

          <button class="btn-primary" style="margin-top:.5rem;">Add to Cart</button>
        </div>
      </div>
    `;
  }

  // Main render function
  function renderProducts(list) {
    grid.innerHTML = list.map(renderItem).join("");
  }

  // Initial render
  renderProducts(allProducts);


  // ================================================================
  // FILTER FUNCTION
  // ================================================================
  function applyFilters() {
    let filtered = [...allProducts];

    const text = searchInput.value.toLowerCase();
    const cat = categorySelect.value;

    // Search filter
    if (text) {
      filtered = filtered.filter(p =>
        p.name.toLowerCase().includes(text) ||
        p.occasions.some(o => o.toLowerCase().includes(text))
      );
    }

    // Category filter
    if (cat) {
      filtered = filtered.filter(p => p.occasions.includes(cat));
    }

    renderProducts(filtered);
  }

  searchInput.addEventListener("input", applyFilters);
  categorySelect.addEventListener("change", applyFilters);

});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop – 22 Celebration Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="logo">
    <span class="logo-mark">22</span>
    <span class="logo-text">Celebration Co.</span>
  </div>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="store.html" class="active">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="header-right">
    <a href="tel:17708201456" class="btn-phone">Call Us</a>
    <div class="cart-indicator">
      🛍️ <span class="cart-count" id="cartCount">0</span>
    </div>
  </div>
</header>

<main>
  <section class="section hero-slim">
    <h1>Shop Gift Boxes & Baskets</h1>
    <p>
      Browse curated gifts for our 22 major holidays and special occasions. 
      Every product can be customized further when you contact us.
    </p>
  </section>

  <section class="section">
    <form id="filterForm" class="filter-bar">
      <div class="filter-group">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Search by name or occasion...">
      </div>
      <div class="filter-group">
        <label for="occasionSelect">Occasion</label>
        <select id="occasionSelect">
          <option value="">All Occasions</option>
          <option>New Year</option>
          <option>Valentine's Day</option>
          <option>St. Patrick's Day</option>
          <option>Easter</option>
          <option>Mother's Day</option>
          <option>Father's Day</option>
          <option>Graduation</option>
          <option>Fourth of July</option>
          <option>Back to School</option>
          <option>Halloween</option>
          <option>Thanksgiving</option>
          <option>Christmas</option>
          <option>Hanukkah</option>
          <option>Kwanzaa</option>
          <option>Birthday - Him</option>
          <option>Birthday - Her</option>
          <option>Birthday - Kids</option>
          <option>Baby Shower</option>
          <option>Wedding</option>
          <option>Anniversary</option>
          <option>Retirement</option>
          <option>Housewarming</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="maxPriceInput">Max Price</label>
        <input type="number" id="maxPriceInput" min="0" placeholder="No limit">
      </div>
      <button type="submit" class="btn-primary">Search</button>
    </form>
  </section>

  <section class="section">
    <div id="productsGrid" class="products-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> 22 Celebration Co. All rights reserved.</p>
  <p>Phone: <a href="tel:17708201456">(770) 820-1456</a></p>
</footer>

<script src="products.js"></script>
<script>
  const productsGrid = document.getElementById('productsGrid');
  const cartCountEl = document.getElementById('cartCount');
  let cartCount = 0;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('year').textContent = new Date().getFullYear();
    renderProducts(products);

    document.getElementById('filterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      applyFilters();
    });
  });

  function renderProducts(list) {
    productsGrid.innerHTML = '';
    if (!list.length) {
      productsGrid.innerHTML = '<p>No products found. Try adjusting your search.</p>';
      return;
    }

    list.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-image-placeholder">Image Coming Soon</div>
        <div class="product-body">
          <h3>${product.name}</h3>
          <p class="product-occasion"><strong>Occasion(s):</strong> ${product.occasions.join(', ')}</p>
          <p class="product-meta">
            <span><strong>Gender:</strong> ${product.gender}</span>
            <span><strong>Max Age:</strong> ${product.maxAge}</span>
          </p>
          <p class="product-price">$${product.price.toFixed(2)}</p>
          <button class="btn-secondary" data-id="${product.id}">Add to Cart</button>
        </div>
      `;
      const btn = card.querySelector('button');
      btn.addEventListener('click', () => addToCart(product));
      productsGrid.appendChild(card);
    });
  }

  function addToCart(product) {
    cartCount += 1;
    cartCountEl.textContent = cartCount;
    alert(`${product.name} has been added to your cart. (Demo only)`);
  }

  function applyFilters() {
    const term = document.getElementById('searchInput').value.trim().toLowerCase();
    const occasion = document.getElementById('occasionSelect').value;
    const maxPriceVal = document.getElementById('maxPriceInput').value;
    const maxPrice = maxPriceVal ? parseFloat(maxPriceVal) : null;

    let filtered = products.slice();

    if (occasion) {
      filtered = filtered.filter(p => p.occasions.includes(occasion));
    }
    if (term) {
      filtered = filtered.filter(p => 
        p.name.toLowerCase().includes(term) ||
        p.occasions.join(' ').toLowerCase().includes(term)
      );
    }
    if (maxPrice !== null && !isNaN(maxPrice)) {
      filtered = filtered.filter(p => p.price <= maxPrice);
    }

    renderProducts(filtered);
  }
</script>
</body>
</html>

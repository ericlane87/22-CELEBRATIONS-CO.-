<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>22 Celebration Co.</title>

  <!-- Add the CSS styles directly here -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }

    .site-header {
      background-color: #ffffff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid gold; /* subtle gold accent */
    }

    .logo {
      display: flex;
      align-items: baseline;
    }

    .logo-mark {
      font-size: 1.5em;
      font-weight: bold;
      color: #007b8f; /* turquoise */
    }

    .logo-text {
      font-size: 1.2em;
      margin-left: 5px;
    }

    .main-nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #333;
    }

    .main-nav a.active {
      font-weight: bold;
      color: #007b8f; /* turquoise for active link */
    }

    .btn-phone {
      background-color: gold;
      color: #333;
      padding: 8px 15px;
      text-decoration: none;
      border-radius: 5px;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .section-title {
      font-size: 2em;
      color: #333;
    }

    .section-subtitle {
      font-size: 1.2em;
      color: #666;
    }

    .holiday-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .holiday-card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      font-size: 1.1em;
    }

    .site-footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }

    /* Chatbot Styles */
    .chatbot-bubble {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007b8f; /* turquoise */
      color: white;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2em;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: none; /* initially hidden */
    }

    .chatbot-window {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 300px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: transform 0.35s ease, opacity 0.35s ease;
      z-index: 1000;
    }

    .chat-header {
      background-color: #007b8f; /* turquoise header */
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .chat-messages {
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .chat-input-row {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input-row input {
      flex: 1;
      border: none;
      padding: 10px;
      border-bottom-left-radius: 10px;
    }

    .btn-primary {
      background-color: gold;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      color: #333;
      border-bottom-right-radius: 10px;
    }

    .chat-msg {
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
      max-width: 80%;
    }

    .chat-msg.bot {
      background-color: #e0f7fa; /* light turquoise */
      align-self: flex-start;
    }

    .chat-msg.user {
      background-color: #f1f1f1;
      align-self: flex-end;
    }

    .chat-close {
      background: none;
      border: none;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
    }
  </style>

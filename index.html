<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>22 Celebration Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SITE CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- LOAD PRODUCTS FOR CHATBOT -->
  <script src="products.js" defer></script>

  <style>
    /* --- CHATBOT FIXED STYLES (OPTION B, TOUCHING BUBBLE) --- */

    /* CHAT BUBBLE */
    #chatbotBubble {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #1abc9c;
      border: 2px solid #d4af37;
      border-radius: 50%;
      display: none; /* Will appear after minimize */
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 9999;
      transition: opacity 0.25s ease;
    }

    /* CHAT WINDOW */
    #chatbotWindow {
      position: fixed;
      bottom: 80px; /* directly above bubble */
      right: 20px;
      width: 340px;    /* final size */
      height: 420px;   /* final size */
      background: #ffffff;
      border: 2px solid #d4af37;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      z-index: 99999;

      /* stable animation */
      opacity: 0;
      transform: translateY(20px) scale(0.97);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .chat-header {
      background: #1abc9c;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .chat-close {
      cursor: pointer;
      background: none;
      border: none;
      color: white;
      font-size: 20px;
    }

    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    .chat-input-row {
      display: flex;
      border-top: 1px solid #ddd;
    }

    #chatInput {
      flex: 1;
      border: none;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    #chatSend {
      background: #d4af37;
      color: #333;
      border: none;
      padding: 0 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-msg {
      padding: 8px 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      max-width: 80%;
    }

    .chat-msg.bot {
      background: #e8faf6;
      align-self: flex-start;
    }

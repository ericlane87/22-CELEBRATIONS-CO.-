<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us – 22 Celebration Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="logo">
    <span class="logo-mark">22</span>
    <span class="logo-text">Celebration Co.</span>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="store.html">Shop</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <a href="tel:17708201456" class="btn-phone">(770) 820-1456</a>
</header>



<!-- MAIN CONTENT -->
<main>

<section class="section">
  <h1 class="section-title">Contact Us</h1>
  <p class="section-subtitle" style="max-width:700px;">
    Have questions or want to order a custom basket?  
    Send us a message and we’ll get back to you quickly!
  </p>
</section>


<section class="section">
  <form class="contact-form"
        action="https://formsubmit.co/your@email.com"
        method="POST">

    <!-- Redirect to a thank-you page -->
    <input type="hidden" name="_next" value="thanks.html">

    <label>Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Message</label>
    <textarea name="message" rows="6" required></textarea>

    <button class="btn-primary" style="width:fit-content;margin-top:.5rem;">
      Send Message
    </button>

  </form>
</section>

</main>


<!-- FOOTER -->
<footer class="site-footer">
  <p>&copy; <span id="year"></span> 22 Celebration Co.</p>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
